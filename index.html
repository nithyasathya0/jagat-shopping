<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ShopEasy - E-Commerce</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- HEADER -->
    <header>
      <div class="logo">ShopEasy</div>

      <div class="search">
        <input type="text" id="searchBox" placeholder="Search products..." />
      </div>

      <div class="cart">
        🛒 Cart
        <span id="cartCount">0</span>
      </div>
    </header>

    <!-- BANNER -->
    <section class="banner">
      <h1>Welcome to ShopEasy</h1>

      <p>Best Products at Best Prices</p>

      <button onclick="scrollToProducts()">Shop Now</button>
    </section>

    <!-- PRODUCTS -->
    <section class="products-section" id="productsSection">
      <h2>Our Products</h2>

      <div class="products" id="productList">
        <!-- PRODUCT 1 -->

        <div class="product-card" data-name="T-Shirt">
          <img
            src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=500&q=80"
            alt="T-Shirt"
          />

          <h3>T-Shirt</h3>

          <p class="price">₹499</p>

          <button onclick="addToCart('T-Shirt', 499)">Add to Cart</button>
        </div>

        <!-- PRODUCT 2 -->

        <div class="product-card" data-name="Shoes">
          <img
            src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=500&q=80"
            alt="Shoes"
          />

          <h3>Shoes</h3>

          <p class="price">₹999</p>

          <button onclick="addToCart('Shoes', 999)">Add to Cart</button>
        </div>

        <!-- PRODUCT 3 -->

        <div class="product-card" data-name="Watch">
          <img
            src="https://images.unsplash.com/photo-1524805444758-089113d48a6d?auto=format&fit=crop&w=500&q=80"
            alt="Watch"
          />

          <h3>Watch</h3>

          <p class="price">₹799</p>

          <button onclick="addToCart('Watch', 799)">Add to Cart</button>
        </div>

        <!-- PRODUCT 4 -->

        <div class="product-card" data-name="Bag">
          <img
            src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=500&q=80"
            alt="Bag"
          />

          <h3>Bag</h3>

          <p class="price">₹699</p>

          <button onclick="addToCart('Bag', 699)">Add to Cart</button>
        </div>

        <!-- PRODUCT 5 -->

        <div class="product-card" data-name="Headphones">
          <img
            src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=500&q=80"
            alt="Headphones"
          />

          <h3>Headphones</h3>

          <p class="price">₹1,499</p>

          <button onclick="addToCart('Headphones', 1499)">Add to Cart</button>
        </div>

        <!-- PRODUCT 6 -->

        <div class="product-card" data-name="Sunglasses">
          <img
            src="https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=500&q=80"
            alt="Sunglasses"
          />

          <h3>Sunglasses</h3>

          <p class="price">₹599</p>

          <button onclick="addToCart('Sunglasses', 599)">Add to Cart</button>
        </div>
      </div>
    </section>

    <!-- CART -->

    <section class="cart-section">
      <h2>Shopping Cart</h2>

      <div id="cartItems">
        <p>Your cart is empty.</p>
      </div>

      <h3>Total: ₹<span id="total">0</span></h3>

      <button class="checkout" onclick="checkout()">Checkout</button>
    </section>

    <!-- FOOTER -->

    <footer>
      <p>© 2026 ShopEasy | All Rights Reserved</p>
    </footer>

    <!-- JAVASCRIPT -->

    <script src="script.js"></script>
  </body>
</html>
